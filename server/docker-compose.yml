version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Nginx TLS Termination & Reverse Proxy Gateway
  # ----------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:alpine
    container_name: urban_furniture_reverse_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - urban_network

  # ----------------------------------------------------------------------------
  # Urban Furniture Node.js / Express API Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urban_furniture_backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - TRUST_PROXY=1
      - MONGO_URI=mongodb://mongodb:27017/urban_furniture_db
      - JWT_SECRET=urban_furniture_super_secret_jwt_key_2026
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=https://localhost,https://urbanfurniture.local
    expose:
      - "5000"
    depends_on:
      - mongodb
    networks:
      - urban_network

  # ----------------------------------------------------------------------------
  # MongoDB Database Engine
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: urban_furniture_db
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - urban_network

networks:
  urban_network:
    driver: bridge

volumes:
  mongo_data:
